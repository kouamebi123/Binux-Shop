parameters:
    env(TRUSTED_PROXIES): '127.0.0.1'
    env(STRIPE_SECRET_KEY): ''
    env(STRIPE_WEBHOOK_SECRET): ''
    env(SETUP_TOKEN): ''
    env(RAILWAY_GIT_COMMIT_SHA): 'dev'
    app.asset_version: '%env(RAILWAY_GIT_COMMIT_SHA)%'
    app.brand_url: 'https://binuxlabs.com'

services:
    _defaults:
        autowire: true
        autoconfigure: true
        bind:
            string $projectDir: '%kernel.project_dir%'
            string $setupToken: '%env(SETUP_TOKEN)%'
            string $brandUrl: '%app.brand_url%'
            string $environment: '%kernel.environment%'

    App\:
        resource: '../src/'
        exclude:
            - '../src/DependencyInjection/'
            - '../src/Entity/'
            - '../src/Kernel.php'

    App\Payment\StripeGateway:
        arguments:
            $secretKey: '%env(STRIPE_SECRET_KEY)%'
            $webhookSecret: '%env(STRIPE_WEBHOOK_SECRET)%'

    App\Payment\PaymentGateway: '@App\Payment\StripeGateway'

    Doctrine\Migrations\DependencyFactory: '@doctrine.migrations.dependency_factory'
